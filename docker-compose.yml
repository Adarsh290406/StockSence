services:
  postgres:
    image: postgres:15-alpine
    container_name: stocksense_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: stocksense_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/stocksense
      JWT_SECRET: stocksense_super_secure_jwt_secret_key_2026_hackathon
    depends_on:
      - postgres

  client:
    build: ./client
    container_name: stocksense_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
